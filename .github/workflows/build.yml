name: Windows build and preview release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Output artifacts/release-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview
          path: |
            artifacts/release-ci/*.zip
            artifacts/release-ci/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-preview
          path: release
      - name: Create draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:RELEASE_TAG" --repo "$env:RELEASE_REPO" --verify-tag --draft --prerelease --title "$env:RELEASE_TAG" --notes "Community preview. See bundled validation and support documentation. VM deployment matrix is pending." ./release/*.zip ./release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft release failed.' }
